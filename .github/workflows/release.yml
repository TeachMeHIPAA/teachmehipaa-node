name: Release

# Manual only. A run without `publish` checks and packs the release but
# publishes nothing; with it, it also publishes to npm through trusted
# publishing. package.json keeps "private": true until launch, so even a
# mistaken `publish` run fails at `npm publish` (see CONTRIBUTING.md).
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to npm (fails while package.json is private)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:contract
      - run: npm run build
      - run: npm run check:dist
      - run: npm pack --dry-run

  publish:
    name: Publish to npm
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    # The npm trusted publisher is pinned to this environment, so only a job
    # that names it can mint a publish credential.
    environment: npm
    permissions:
      contents: read
      # npm trusted publishing exchanges this OIDC token for a short-lived
      # publish credential and signs the provenance statement.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Trusted publishing needs npm 11.5.1 or newer, which Node 24 ships.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm run check:dist
      - run: npm publish
